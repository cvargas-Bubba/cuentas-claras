<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="description" content="Registra tus ingresos y gastos, y ahorra para tus metas.">
<meta name="theme-color" content="#0B6E5F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuentas Claras">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Cuentas Claras</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --ground:#EEF1F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#16202A; --ink-2:#3A4552; --muted:#5D6875;
  --line:#DCE2E8; --line-2:#C9D1D9;
  --accent:#0B6E5F; --accent-ink:#FFFFFF; --accent-soft:#DDEFEA;
  --in:#3A7FD0; --in-text:#1C5A9C; --in-soft:#E3EEFA;
  --out:#E07434; --out-text:#A94A16; --out-soft:#FCEBDF;
  --save:#12836F; --save-text:#0B6B5B; --save-soft:#DCF1EB;
  --danger:#B42335; --danger-soft:#FBE5E8; --warn:#9A6A00; --warn-soft:#FFF3D1;
  --shadow:0 10px 30px -12px rgba(22,32,42,.28);
  --f-display:"Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body:"Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#11161B; --surface:#1A2128; --surface-2:#151B21; --ink:#E6EBF0; --ink-2:#C2CAD2; --muted:#98A3AE;
    --line:#2B343D; --line-2:#3A444E;
    --accent:#3FBFA6; --accent-ink:#0B1A17; --accent-soft:#16332D;
    --in:#6AA6EC; --in-text:#8DBBF2; --in-soft:#17293D;
    --out:#F0944F; --out-text:#F5AE78; --out-soft:#3A2517;
    --save:#4CC9AE; --save-text:#7ADBC6; --save-soft:#14332D;
    --danger:#F07A87; --danger-soft:#3A1C21; --warn:#E9B949; --warn-soft:#352B12;
    --shadow:0 10px 30px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#11161B; --surface:#1A2128; --surface-2:#151B21; --ink:#E6EBF0; --ink-2:#C2CAD2; --muted:#98A3AE;
  --line:#2B343D; --line-2:#3A444E;
  --accent:#3FBFA6; --accent-ink:#0B1A17; --accent-soft:#16332D;
  --in:#6AA6EC; --in-text:#8DBBF2; --in-soft:#17293D;
  --out:#F0944F; --out-text:#F5AE78; --out-soft:#3A2517;
  --save:#4CC9AE; --save-text:#7ADBC6; --save-soft:#14332D;
  --danger:#F07A87; --danger-soft:#3A1C21; --warn:#E9B949; --warn-soft:#352B12;
  --shadow:0 10px 30px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{background:var(--ground);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- barra superior ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--ground);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand-mark{width:22px;height:22px;border-radius:6px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-size:13px;font-weight:800}
.month{display:flex;align-items:center;gap:2px;margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.month button{border:0;background:transparent;width:32px;height:32px;border-radius:999px;cursor:pointer;font-size:18px;line-height:1;color:var(--ink-2)}
.month button:hover{background:var(--surface-2)}
.month-label{min-width:128px;text-align:center;font-weight:600;font-size:14px}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--line-2);display:block}
.sync[data-s="nube"] i,.sync[data-s="dispositivo"] i{background:var(--accent)}
.sync[data-s="guardando"] i{background:var(--warn)}
.sync[data-s="local"] i{background:var(--out)}
.tabs{display:flex;gap:2px}
.tab{border:0;background:transparent;padding:8px 11px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted);font-size:14px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.tab:hover{color:var(--ink)}
@media (max-width:1140px){.sync span{display:none}}

/* ---------- estructura ---------- */
.shell{max-width:1240px;margin:0 auto;padding:18px 16px 120px;display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:960px){
  .shell{grid-template-columns:360px minmax(0,1fr);align-items:start;padding-bottom:40px}
  .aside{position:sticky;top:72px}
  .fab,.bottom-nav,.sheet-head .close{display:none!important}
}
@media (max-width:959px){
  .top .tabs{display:none}
  .aside{position:fixed;inset:auto 0 0 0;z-index:40;transform:translateY(105%);transition:transform .22s ease;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0}
  .aside.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(10,14,18,.45);z-index:35}
}
@media (prefers-reduced-motion: reduce){.aside{transition:none}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.pad{padding:18px}
h2{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0;font-weight:600}
.view{display:grid;gap:18px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.hint{font-size:12px;color:var(--muted)}

/* ---------- formulario ---------- */
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.close{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:8px 4px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"][data-t="gasto"]{background:var(--out-soft);color:var(--out-text)}
.seg button[aria-pressed="true"][data-t="ingreso"]{background:var(--in-soft);color:var(--in-text)}
.seg button[aria-pressed="true"][data-t="ahorro"]{background:var(--save-soft);color:var(--save-text)}
.field{display:grid;gap:6px;margin-top:14px}
.field>label,.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.input,select.input{width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:9px;padding:10px 12px;min-height:42px}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.amount-wrap{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line-2);padding:4px 2px}
.amount-wrap:focus-within{border-color:var(--accent)}
.amount-wrap span{font-family:var(--f-mono);font-size:26px;color:var(--muted)}
.amount{border:0;background:transparent;font-family:var(--f-mono);font-size:34px;font-weight:600;width:100%;outline:none;padding:0;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer;font-weight:500;color:var(--ink-2)}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:10px 14px;font-weight:600;cursor:pointer;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft)}
.btn.small{min-height:32px;padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
.actions{display:grid;gap:8px;margin-top:18px}
.suggest{background:var(--save-soft);border:1px solid color-mix(in srgb,var(--save) 35%,transparent);border-radius:12px;padding:14px;display:grid;gap:10px;margin-bottom:16px}
.suggest p{margin:0}

/* ---------- avisos y cifras ---------- */
.notice{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:12px;padding:12px 14px;font-size:14px}
.notice.info{background:var(--in-soft);border-color:color-mix(in srgb,var(--in) 35%,transparent)}
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.fig{padding:16px 18px;display:grid;gap:4px;border-left:1px solid var(--line);align-content:start}
.fig:first-child{border-left:0}
.fig .v{font-family:var(--f-display);font-weight:700;font-size:clamp(19px,2.4vw,27px);letter-spacing:-.02em;white-space:nowrap}
.fig .k{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
@media (max-width:1180px) and (min-width:960px), (max-width:640px){
  .figs{grid-template-columns:1fr 1fr}
  .fig:nth-child(odd){border-left:0}
  .fig:nth-child(n+3){border-top:1px solid var(--line)}
}
.fig .pill{white-space:normal}
.key{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.key.in{background:var(--in)} .key.out{background:var(--out)} .key.save{background:var(--save)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.good{background:var(--accent-soft);color:var(--accent)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.grid-2{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1180px){.grid-2{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}}
.cats{display:grid;gap:12px;margin-top:14px}
.cat{display:grid;gap:5px}
.cat-top{display:flex;align-items:baseline;gap:8px;font-size:14px}
.cat-top .n{font-weight:600}
.cat-top .a{margin-left:auto;white-space:nowrap}
.bar{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar i{display:block;height:100%;background:var(--out);border-radius:0 4px 4px 0}
.bar.over i{background:var(--danger)}
.bar.in i{background:var(--in)}
.chart-wrap{margin-top:10px;position:relative}
.chart-wrap svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:12px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.5;white-space:nowrap;transform:translate(-50%,-100%);box-shadow:var(--shadow);z-index:5}
.empty{padding:28px 18px;text-align:center;color:var(--muted);font-size:14px}

/* ---------- ahorro y metas ---------- */
.hero{display:grid;gap:18px;grid-template-columns:minmax(0,1fr);padding:18px}
@media (min-width:760px){.hero{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);align-items:center}}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,5.5vw,48px);letter-spacing:-.03em;line-height:1.05}
.streak{display:flex;gap:5px;align-items:center}
.streak i{width:14px;height:14px;border-radius:4px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-2);display:block}
.streak i.on{background:var(--save);box-shadow:none}
.streak i.now{outline:2px solid var(--ink-2);outline-offset:1px}
.goal-bar{position:relative;height:14px;background:var(--surface-2);border-radius:7px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.goal-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--save);border-radius:7px}
.goal-bar b{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--surface);opacity:.9}
.goals{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.goal-card{padding:16px;display:grid;gap:10px;align-content:start}
.goal-card.principal{box-shadow:inset 0 0 0 2px var(--save);border-color:transparent}
.goal-name{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em}
.goal-amt{font-family:var(--f-display);font-weight:700;font-size:25px;letter-spacing:-.02em}
.badges{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));margin-top:14px}
.badge{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px}
.badge .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);font-weight:800;font-family:var(--f-display);font-size:12px;box-shadow:inset 0 0 0 1px var(--line-2)}
.badge.ok{border-color:color-mix(in srgb,var(--save) 45%,var(--line))}
.badge.ok .ic{background:var(--save);color:var(--accent-ink);box-shadow:none}
.badge .bt{font-weight:600;font-size:14px}
.badge .bd{font-size:12px;color:var(--muted)}
.map{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
details.panel summary{cursor:pointer;font-weight:600}

/* ---------- movimientos ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters .input{width:auto;min-height:38px;padding:7px 10px}
.filters .search{flex:1 1 200px}
.day{border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day-h{display:flex;justify-content:space-between;padding:10px 18px 4px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.mov{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 18px;cursor:pointer;width:100%;border:0;background:transparent;text-align:left}
.mov:hover{background:var(--surface-2)}
.mov .stripe{width:4px;height:30px;border-radius:2px;background:var(--out)}
.mov.ingreso .stripe{background:var(--in)}
.mov.ahorro .stripe{background:var(--save)}
.mov .t{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mov .s{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mov .m{font-weight:600;font-size:14px;color:var(--out-text);white-space:nowrap}
.mov.ingreso .m{color:var(--in-text)}
.mov.ahorro .m{color:var(--save-text)}
.tag{font-size:11px;font-weight:600;border-radius:4px;padding:1px 5px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

/* ---------- importar ---------- */
.step-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.step-n{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.drop{border:2px dashed var(--line-2);border-radius:12px;padding:26px 16px;text-align:center;display:grid;gap:8px;justify-items:center;cursor:pointer;background:var(--surface-2)}
.drop.hover{border-color:var(--accent);background:var(--accent-soft)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2);position:sticky;top:0}
td.r,th.r{text-align:right}
tr.dup td{opacity:.55}
td select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 6px;max-width:170px}
.preview-box{max-height:420px;overflow:auto}

/* ---------- ajustes ---------- */
.list{display:grid;margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.li{display:grid;grid-template-columns:minmax(0,1fr) 130px 34px;gap:8px;align-items:center;padding:6px 8px 6px 12px;border-top:1px solid var(--line);background:var(--surface)}
.li:first-child{border-top:0}
.li.simple{grid-template-columns:minmax(0,1fr) 34px}
.li .input{min-height:34px;padding:5px 8px;text-align:right}
.x{border:0;background:transparent;width:34px;height:34px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:18px}
.x:hover{background:var(--danger-soft);color:var(--danger)}
.add{display:flex;gap:8px;margin-top:10px}
.add .input{min-height:38px}

/* ---------- móvil ---------- */
.fab{position:fixed;right:18px;bottom:84px;z-index:30;border:0;background:var(--accent);color:var(--accent-ink);height:54px;padding:0 20px 0 16px;border-radius:999px;font-weight:700;font-size:15px;box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;gap:6px}
.fab b{font-size:24px;line-height:1;font-weight:500}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.bottom-nav button{border:0;background:transparent;padding:8px 2px;font-size:12px;font-weight:600;color:var(--muted);border-radius:8px;cursor:pointer}
.bottom-nav button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;z-index:60;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
@media (max-width:959px){.toast{bottom:150px}}
</style>
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><span class="brand-mark" aria-hidden="true">$</span>Cuentas Claras</div>
    <nav class="tabs" role="tablist" aria-label="Secciones">
      <button class="tab" role="tab" data-view="resumen">Resumen</button>
      <button class="tab" role="tab" data-view="metas">Metas</button>
      <button class="tab" role="tab" data-view="movimientos">Movimientos</button>
      <button class="tab" role="tab" data-view="importar">Importar Excel</button>
      <button class="tab" role="tab" data-view="ajustes">Ajustes</button>
    </nav>
    <div class="month" aria-label="Mes">
      <button id="mPrev" aria-label="Mes anterior">‹</button>
      <div class="month-label" id="mLabel">—</div>
      <button id="mNext" aria-label="Mes siguiente">›</button>
    </div>
    <div class="sync" id="sync" data-s="cargando" title="Estado de guardado"><i></i><span id="syncTxt">Cargando…</span></div>
  </div>
</header>

<div class="shell">
  <aside class="aside panel pad" id="aside" aria-label="Registrar movimiento"></aside>
  <main id="main"></main>
</div>

<div class="scrim" id="scrim" hidden></div>
<button class="fab" id="fab"><b>+</b> Registrar</button>
<nav class="bottom-nav" role="tablist" aria-label="Secciones">
  <button role="tab" data-view="resumen">Resumen</button>
  <button role="tab" data-view="metas">Metas</button>
  <button role="tab" data-view="movimientos">Movim.</button>

/* ============ utilidades ============ */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const CLP = new Intl.NumberFormat("es-CL", { style: "currency", currency: "CLP", maximumFractionDigits: 0 });
const fmt = n => CLP.format(Math.round(n || 0));
const fmtN = n => new Intl.NumberFormat("es-CL").format(Math.round(n || 0));
const signo = n => (n < 0 ? "−" : "") + fmt(Math.abs(n));
function compacto(n) {
  const a = Math.abs(n);
  if (a >= 1e6) return "$" + (n / 1e6).toLocaleString("es-CL", { maximumFractionDigits: 1 }) + " M";
  if (a >= 1e3) return "$" + Math.round(n / 1e3).toLocaleString("es-CL") + " mil";
  return "$" + Math.round(n);
}
const pad2 = n => String(n).padStart(2, "0");
const isoDe = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const fechaDe = iso => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); };
const hoyISO = () => isoDe(new Date());
const mesDe = iso => iso.slice(0, 7);
const sumaDias = (iso, n) => { const f = fechaDe(iso); f.setDate(f.getDate() + n); return isoDe(f); };
const diasEntre = (a, b) => Math.round((Date.UTC(...a.split("-").map((v, i) => +v - (i === 1 ? 1 : 0))) - Date.UTC(...b.split("-").map((v, i) => +v - (i === 1 ? 1 : 0)))) / -864e5);
const lunesDe = iso => { const f = fechaDe(iso); f.setDate(f.getDate() - ((f.getDay() + 6) % 7)); return isoDe(f); };
function mesSuma(mes, k) {
  let [y, m] = mes.split("-").map(Number);
  m += k; y += Math.floor((m - 1) / 12); m = (((m - 1) % 12) + 12) % 12 + 1;
  return `${y}-${pad2(m)}`;
}
function fechaSumaMeses(iso, k) {
  const [, , d] = iso.split("-").map(Number);

}

  return corto ? s : s.charAt(0).toUpperCase() + s.slice(1);
}
function fechaLarga(iso) {
  const o = { weekday: "long", day: "numeric", month: "short" };
  if (+iso.slice(0, 4) !== new Date().getFullYear()) o.year = "numeric";
  const s = fechaDe(iso).toLocaleDateString("es-CL", o).replace(/\./g, "");
  return s.charAt(0).toUpperCase() + s.slice(1);
}
const fechaCorta = iso => fechaDe(iso).toLocaleDateString("es-CL", { day: "numeric", month: "short", year: "numeric" }).replace(/\./g, "");
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const norm = s => String(s ?? "").normalize("NFD").replace(/\p{M}/gu, "").toLowerCase().replace(/\s+/g, " ").trim();

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

/* ============ configuración base ============ */

/* ============ estado ============ */
const VISTAS = ["resumen", "metas", "movimientos", "importar", "ajustes"];
const S = {

function normalizarAjustes(a) {
  const x = JSON.parse(JSON.stringify(a || {}));
  if (!Array.isArray(x.categorias) || !x.categorias.length) x.categorias = JSON.parse(JSON.stringify(AJUSTES_BASE.categorias));
  if (!Array.isArray(x.cuentas) || !x.cuentas.length) x.cuentas = AJUSTES_BASE.cuentas.slice();
  x.categorias = x.categorias.filter(c => c && c.nombre).map(c => ({ nombre: String(c.nombre), tipo: c.tipo === "ingreso" ? "ingreso" : "gasto", presupuesto: Math.max(0, Math.round(+c.presupuesto || 0)) }));
  x.cuentas = x.cuentas.map(String);
  x.metas = (Array.isArray(x.metas) ? x.metas : []).filter(m => m && m.id && m.nombre).map(m => ({
    id: String(m.id), nombre: String(m.nombre), objetivo: Math.max(0, Math.round(+m.objetivo || 0)),
    fecha: /^\d{4}-\d{2}-\d{2}$/.test(m.fecha || "") ? m.fecha : "", creada: m.creada || hoyISO(), archivada: !!m.archivada
  }));
  x.metaPrincipal = String(x.metaPrincipal || "");
  const p = +x.ahorroPct;
  x.ahorroPct = Number.isFinite(p) ? Math.min(50, Math.max(0, Math.round(p))) : 10;
  return x;
}
const cats = tipo => S.ajustes.categorias.filter(c => c.tipo === tipo);

/* ============ datos de ejemplo (solo se muestran, nunca se guardan) ============ */
let DEMO = null;
function demo() {
  if (DEMO) return DEMO;
  let seed = 11;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const entre = (a, b) => Math.round((a + rnd() * (b - a)) / 100) * 100;
  const hoy = hoyISO(), actual = mesDe(hoy), meses = {};
  let n = 0;
  const add = (fecha, tipo, monto, cat, cuenta, desc, meta) => {
    if (fecha > hoy) return;
    const id = "demo" + n++;
    (meses[mesDe(fecha)] ||= {})[id] = { id, fecha, tipo, monto, cat, cuenta, desc, meta, demo: true };
  };
  const metas = [
    { id: "dm1", nombre: "Notebook para la U", objetivo: 650000, fecha: fechaSumaMeses(`${actual}-15`, 4), creada: `${mesSuma(actual, -5)}-01`, archivada: false },
    { id: "dm2", nombre: "Fondo para imprevistos", objetivo: 200000, fecha: "", creada: `${mesSuma(actual, -5)}-01`, archivada: false }
  ];
  for (let k = -5; k <= 0; k++) {
    const mes = mesSuma(actual, k), d = dia => `${mes}-${pad2(dia)}`;
    add(d(1), "ingreso", 120000, "Mesada o aporte familiar", "Cuenta RUT", "Mesada");
    add(d(20), "ingreso", entre(140000, 210000), "Trabajo", "Cuenta RUT", "Turnos en cafetería");
    if (k % 3 === 0) add(d(12), "ingreso", entre(12000, 25000), "Ventas", "Cuenta RUT", "Venta de ropa usada");
    [3, 8, 14, 22, 27].forEach(x => add(d(x), "gasto", entre(3500, 9000), "Comida y colaciones", "Cuenta RUT", "Colación"));
    add(d(10), "gasto", entre(15000, 26000), "Comida y colaciones", "Débito", "Lider");
    [2, 16].forEach(x => add(d(x), "gasto", entre(6000, 10000), "Transporte", "Débito", "Carga Bip!"));
    add(d(18), "gasto", entre(4000, 8000), "Transporte", "Débito", "Uber");
    add(d(6), "gasto", entre(3000, 8000), "Estudios", "Efectivo", "Fotocopias y apuntes");
    add(d(13), "gasto", entre(14000, 26000), "Salidas y carrete", "Débito", "Salida con amigas");
    add(d(25), "gasto", entre(7000, 12000), "Salidas y carrete", "Débito", "Cine");
    add(d(5), "gasto", 3190, "Suscripciones y apps", "Débito", "Spotify Premium Estudiantes");
    add(d(9), "gasto", 10000, "Celular e internet", "Cuenta RUT", "Recarga WOM");
    if (k % 2 === 0) add(d(21), "gasto", entre(15000, 32000), "Ropa y cuidado personal", "Débito", "Zara");
    if (k === -2) add(d(17), "gasto", 15000, "Regalos", "Débito", "Regalo cumpleaños");
    if (k === -3) add(d(24), "ahorro", -20000, "Fondo para imprevistos", "", "Dentista", "dm2");
  }
  // un aporte cada semana, alternando metas
  let f = lunesDe(`${mesSuma(actual, -5)}-01`), w = 0;
  while (f <= hoy) {
    const aporte = sumaDias(f, 2);
    if (w % 4 === 3) add(aporte, "ahorro", 10000, "Fondo para imprevistos", "", "", "dm2");
    else add(aporte, "ahorro", 15000, "Notebook para la U", "", "", "dm1");
    f = sumaDias(f, 7); w++;
  }
  return (DEMO = { meses, metas });
}
const real = () => { const o = []; for (const m in S.meses) for (const id in S.meses[m]) if (S.meses[m][id]) o.push(S.meses[m][id]); return o; };
const enDemo = () => S.cargado && !S.demoOculto && real().length === 0 && S.ajustes.metas.length === 0;
const fuenteMeses = () => (enDemo() ? demo().meses : S.meses);
const movsMes = mes => Object.values(fuenteMeses()[mes] || {}).filter(Boolean);
const movsTodos = () => { const f = fuenteMeses(), o = []; for (const m in f) for (const id in f[m]) if (f[m][id]) o.push(f[m][id]); return o; };
const todasMetas = () => (enDemo() ? demo().metas : S.ajustes.metas);
const metasActivas = () => todasMetas().filter(m => !m.archivada);
const metaPorId = id => todasMetas().find(m => m.id === id);
function metaPrincipal() {
  const act = metasActivas(), id = enDemo() ? "dm1" : S.ajustes.metaPrincipal;
  return act.find(m => m.id === id) || act[0] || null;
}
function saldosMetas() {
  const s = new Map();
  movsTodos().forEach(m => { if (m.tipo === "ahorro") s.set(m.meta, (s.get(m.meta) || 0) + m.monto); });
  return s;
}

/* ============ almacenamiento ============ */
function setSync(s, txt) { $("#sync").dataset.s = s; $("#syncTxt").textContent = txt; $("#sync").title = txt; }
function msgError(e) {
  const c = e && e.code;
  if (c === "quota_exceeded") return "Se llenó el espacio de almacenamiento. Exporta a Excel y elimina movimientos antiguos.";
  if (c === "invalid_argument") return "No se pudo guardar: demasiados movimientos en un solo lote.";
  if (c === "resource_exhausted") return "Demasiadas operaciones seguidas. Espera unos segundos e intenta de nuevo.";
  return "No se pudo guardar. Revisa tu conexión e intenta de nuevo.";
}
async function init() {
  renderForm(); renderView();
  let db = null;
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("downloads").then(d => { S.dl = d; }).catch(() => {});
    try { db = await window.claude.use("db"); } catch (e) { db = null; }
  }
  if (db) { S.db = db; S.modo = "nube"; conectarNube(); }
  else { S.modo = "local"; cargarLocal(); }
}
function conectarNube() {
  setSync("guardando", "Conectando…");
  S.db.collection("meses").onSnapshot(snap => {
    const m = {};
    snap.docs.forEach(d => { const x = d.data(); m[d.id] = (x && x.items) || {}; });
    S.meses = m; S.ver++; S.okM = true; trasCarga(false);
  }, errorNube);
  S.db.doc("ajustes/principal").onSnapshot(snap => {
    if (snap.exists) S.ajustes = normalizarAjustes(snap.data());
    S.okA = true; trasCarga(true);
  }, errorNube);
}
function trasCarga(cambioAjustes) {
  if (!S.okM || !S.okA) return;
  const primera = !S.cargado;
  S.cargado = true;
  if (!S.pend) setSync("nube", "Sincronizado");
  if (primera || cambioAjustes) renderForm();
  renderView();
}
function errorNube() {
  setSync("local", "Sin conexión");
  toast("Se perdió la conexión con tus datos. Recarga la página.");
}
function cargarLocal() {
  try {
    const raw = lsGet("cc.datos");
    if (raw) { const d = JSON.parse(raw); S.meses = d.meses || {}; if (d.ajustes) S.ajustes = normalizarAjustes(d.ajustes); }
  } catch (e) {}
  S.cargado = true; S.ver++;
  setSync("dispositivo", "Guardado en este dispositivo");
  if (!window.claude) {
    if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  }
  renderForm(); renderView();
}
const guardarLocal = () => lsSet("cc.datos", JSON.stringify({ meses: S.meses, ajustes: S.ajustes }));

/* cambios = { "2026-09": { id: movimiento | null } }  (null = eliminar) */
async function escribir(cambios) {
  if (S.modo !== "nube") {
    for (const mes in cambios) {
      const t = (S.meses[mes] = S.meses[mes] || {});
      for (const id in cambios[mes]) { if (cambios[mes][id]) t[id] = cambios[mes][id]; else delete t[id]; }
    }
    S.ver++; guardarLocal(); renderView();
    return;
  }
  S.pend++; setSync("guardando", "Guardando…");
  try {
    for (const mes in cambios) {
      const ref = S.db.doc("meses/" + mes), ids = Object.keys(cambios[mes]);
      for (let i = 0; i < ids.length; i += 300) {
        const parte = {};
        ids.slice(i, i + 300).forEach(id => (parte[id] = cambios[mes][id]));
        await escribirDoc(ref, mes, parte);
      }
    }
  } catch (e) { toast(msgError(e)); throw e; }
  finally { S.pend--; if (!S.pend) setSync("nube", "Sincronizado"); }
}
async function escribirDoc(ref, mes, parte) {
  if (S.meses[mes] !== undefined) {
    try { await ref.update({ items: parte }); return; } catch (e) { if (e.code !== "invalid_argument") throw e; }
  }
  const snap = await ref.get();
  if (snap.exists) await ref.update({ items: parte });
  else await ref.set({ mes, items: Object.fromEntries(Object.entries(parte).filter(([, v]) => v)) });
}
async function guardarAjustes() {
  if (S.modo !== "nube") guardarLocal();
  else {
    setSync("guardando", "Guardando…");
    try { await S.db.doc("ajustes/principal").set(JSON.parse(JSON.stringify(S.ajustes))); setSync("nube", "Sincronizado"); }
    catch (e) { toast(msgError(e)); setSync("nube", "Error al guardar"); }
  }
  renderForm(); renderView();
}
function agruparPorMes(movs) { const c = {}; movs.forEach(m => ((c[mesDe(m.fecha)] ||= {})[m.id] = m)); return c; }
function cambiosDe(nuevo, orig) {
  const c = {};
  if (orig && mesDe(orig.fecha) !== mesDe(nuevo.fecha)) (c[mesDe(orig.fecha)] ||= {})[orig.id] = null;
  (c[mesDe(nuevo.fecha)] ||= {})[nuevo.id] = nuevo;
  return c;
}

/* ============ categorías sugeridas ============ */
const sinCuota = d => d.replace(/\s*\(\d+\/\d+\)$/, "");
let HIST = { ver: -1 };
function historial(tipo) {
  if (HIST.ver !== S.ver) {
    HIST = { ver: S.ver, gasto: new Map(), ingreso: new Map() };
    real().sort((a, b) => (a.creado || 0) - (b.creado || 0)).forEach(m => { const k = sinCuota(norm(m.desc)); if (k && HIST[m.tipo]) HIST[m.tipo].set(k, m.cat); });
  }
  return HIST[tipo] || new Map();
}
function sugerir(desc, tipo) {
  const d = norm(desc);
  if (!d || tipo === "ahorro") return "";
  const nombres = cats(tipo).map(c => c.nombre);
  const previo = historial(tipo).get(sinCuota(d)); // lo que ya usaste para una descripción igual
  if (previo && nombres.includes(previo)) return previo;
  for (const [re, cat] of tipo === "gasto" ? REGLAS_GASTO : REGLAS_INGRESO) if (re.test(" " + d + " ") && nombres.includes(cat)) return cat;
  return "";
}
const catPorDefecto = tipo => { const l = cats(tipo).map(c => c.nombre); return l.find(n => /^otros/i.test(n)) || l[l.length - 1] || (tipo === "gasto" ? "Otros gastos" : "Otros ingresos"); };

/* ============ ahorro: rachas, planes y logros ============ */
function totales(movs) {
  let i = 0, g = 0, a = 0;
  movs.forEach(m => { if (m.tipo === "ingreso") i += m.monto; else if (m.tipo === "gasto") g += m.monto; else a += m.monto; });
  return { i, g, a, s: i - g - a };
}
function rachas() {
  const sem = {};
  movsTodos().forEach(m => { if (m.tipo === "ahorro") { const w = lunesDe(m.fecha); sem[w] = (sem[w] || 0) + m.monto; } });
  const on = w => (sem[w] || 0) > 0, hoyL = lunesDe(hoyISO());
  let w = on(hoyL) ? hoyL : sumaDias(hoyL, -7), actual = 0;
  while (on(w)) { actual++; w = sumaDias(w, -7); }
  let mejor = 0, seguidas = 0, prev = null;
  Object.keys(sem).filter(on).sort().forEach(x => { seguidas = prev && diasEntre(prev, x) === 7 ? seguidas + 1 : 1; mejor = Math.max(mejor, seguidas); prev = x; });
  const ultimas = Array.from({ length: 8 }, (_, k) => { const x = sumaDias(hoyL, -7 * (7 - k)); return { w: x, on: on(x), actual: x === hoyL }; });
  return { actual, mejor, ultimas, estaSemana: on(hoyL) };
}
const puntosRacha = r => `<div class="streak" role="img" aria-label="Ahorraste en ${r.ultimas.filter(u => u.on).length} de las últimas 8 semanas">${r.ultimas.map(u => `<i class="${u.on ? "on" : ""} ${u.actual ? "now" : ""}" title="Semana del ${fechaCorta(u.w)}${u.on ? ": ahorraste" : ""}"></i>`).join("")}</div>`;
const textoRacha = r => (r.actual ? `<b>${plural(r.actual, "semana seguida", "semanas seguidas")}</b> ahorrando` : "Aparta algo esta semana para empezar una racha");
function planMeta(meta, saldo) {
  if (!meta.objetivo) return "Define un monto para ver tu avance.";
  const falta = Math.max(0, meta.objetivo - saldo);
  if (!falta) return "¡Meta cumplida! Puedes archivarla o subir el monto.";
  const redondo = v => fmt(Math.ceil(v / 100) * 100);
  if (meta.fecha) {
    const dias = diasEntre(hoyISO(), meta.fecha);
    if (dias <= 0) return `La fecha límite ya pasó. Faltan ${fmt(falta)}.`;
    return `Faltan ${fmt(falta)}. Para llegar el ${fechaCorta(meta.fecha)}, aparta ${redondo(falta / Math.max(1, Math.ceil(dias / 7)))} por semana.`;
  }
  const desde = sumaDias(lunesDe(hoyISO()), -56);
  const ritmo = movsTodos().filter(m => m.tipo === "ahorro" && m.meta === meta.id && m.fecha >= desde).reduce((s, m) => s + m.monto, 0) / 8;
  if (ritmo <= 0) return `Faltan ${fmt(falta)}. Ponle fecha para saber cuánto apartar por semana.`;
  return `Faltan ${fmt(falta)}. A tu ritmo (${redondo(ritmo)} por semana) llegas en ${nombreMes(mesDe(sumaDias(hoyISO(), Math.ceil(falta / ritmo) * 7))).toLowerCase()}.`;
}
function calcLogros() {
  const movs = movsTodos(), metas = todasMetas(), saldos = saldosMetas(), r = rachas();
  const ahorro = movs.filter(m => m.tipo === "ahorro");
  const total = ahorro.reduce((s, m) => s + m.monto, 0);
  const maxPct = Math.max(0, ...metas.map(m => (m.objetivo ? (saldos.get(m.id) || 0) / m.objetivo : 0)));
  const porMes = {};
  movs.forEach(m => (porMes[mesDe(m.fecha)] ||= []).push(m));
  const meses = Object.keys(porMes).map(k => ({ k, ...totales(porMes[k]) }));
  const cerrados = meses.filter(t => t.k < mesDe(hoyISO()));
  return [
    { id: "primer", ic: "1°", t: "Primer ahorro", d: "Aparta dinero por primera vez", ok: ahorro.some(m => m.monto > 0) },
    { id: "meta", ic: "+", t: "Con un propósito", d: "Crea tu primera meta", ok: metas.length > 0 },
    { id: "p25", ic: "25%", t: "Buen comienzo", d: "Llega al 25% de una meta", ok: maxPct >= 0.25 },
    { id: "p50", ic: "50%", t: "Mitad del camino", d: "Llega al 50% de una meta", ok: maxPct >= 0.5 },
    { id: "p100", ic: "100%", t: "Meta cumplida", d: "Completa una meta", ok: maxPct >= 1 },
    { id: "r4", ic: "4s", t: "Un mes constante", d: "4 semanas seguidas ahorrando", ok: r.mejor >= 4 },
    { id: "r12", ic: "12s", t: "Hábito formado", d: "12 semanas seguidas ahorrando", ok: r.mejor >= 12 },
    { id: "m10", ic: "10%", t: "Ahorra primero", d: "Aparta el 10% de lo que recibes en un mes", ok: meses.some(t => t.i > 0 && t.a >= t.i * 0.1) },
    { id: "verde", ic: "$", t: "Mes en verde", d: "Cierra un mes gastando menos de lo que recibiste", ok: cerrados.some(t => t.i > 0 && t.g < t.i) },
    { id: "t100", ic: "100k", t: "Primeros $100 mil", d: "Junta $100.000 ahorrados en total", ok: total >= 100000 }
  ];
}
function revisarLogros() {
  if (!S.cargado) return;
  if (enDemo()) { S.logrosPrev = new Set(); return; }
  const lista = calcLogros();
  if (S.logrosPrev) lista.filter(l => l.ok && !S.logrosPrev.has(l.id)).slice(0, 2).forEach(l => toast(`Logro desbloqueado: ${l.t}`));
  S.logrosPrev = new Set(lista.filter(l => l.ok).map(l => l.id));
}

/* gráfico de columnas: ingresos, gastos y ahorro de 6 meses hasta el mes elegido */
function escalaBonita(max) {
  if (max <= 0) return { top: 100000, paso: 25000 };
  const bruto = max / 4, pot = Math.pow(10, Math.floor(Math.log10(bruto)));
  const paso = [1, 2, 2.5, 5, 10].map(k => k * pot).find(p => p >= bruto);
  return { top: Math.ceil(max / paso) * paso, paso };
}
function columna(x, y, w, h) {
  if (h <= 0.5) return "";
  const r = Math.min(4, h, w / 2);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
function montarGrafico() {
  const cont = $("#chart");
  if (!cont) return;
  const datos = [-5, -4, -3, -2, -1, 0].map(k => { const m = mesSuma(S.mes, k); return { m, ...totales(movsMes(m)) }; });
  const W = Math.max(280, cont.clientWidth), H = 220, ml = 58, mr = 6, mt = 22, mb = 26;
  const { top, paso } = escalaBonita(Math.max(...datos.map(d => Math.max(d.i, d.g, d.a))));
  const y = v => mt + (H - mt - mb) * (1 - Math.max(0, v) / top);
  const banda = (W - ml - mr) / datos.length, bw = Math.max(4, Math.min(16, (banda - 16) / 3));
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos, gastos y ahorro de los últimos 6 meses">`;
  for (let v = 0; v <= top + 1; v += paso) {
    s += `<line x1="${ml}" x2="${W - mr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>`;
    s += `<text x="${ml - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" style="font-variant-numeric:tabular-nums">${v === 0 ? "$0" : compacto(v)}</text>`;
  }
  datos.forEach((d, k) => {
    const cx = ml + banda * k + banda / 2, actual = d.m === S.mes, x0 = cx - (bw * 3 + 4) / 2;
    [[d.i, "var(--in)"], [d.g, "var(--out)"], [d.a, "var(--save)"]].forEach(([v, color], j) => {
      s += `<path d="${columna(x0 + j * (bw + 2), y(v), bw, y(0) - y(v))}" fill="${color}" opacity="${actual ? 1 : 0.7}"/>`;
    });
    if (actual && d.a > 0) s += `<text x="${x0 + 2 * (bw + 2) + bw / 2}" y="${y(d.a) - 6}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">${compacto(d.a)}</text>`;
    s += `<text x="${cx}" y="${H - 8}" text-anchor="middle" font-size="12" fill="${actual ? "var(--ink)" : "var(--muted)"}" font-weight="${actual ? 700 : 400}">${nombreMes(d.m, true)}</text>`;
    s += `<rect x="${ml + banda * k}" y="${mt}" width="${banda}" height="${H - mt}" fill="transparent" data-k="${k}" style="cursor:pointer"/>`;
  });
  s += `<line x1="${ml}" x2="${W - mr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line-2)" stroke-width="1"/></svg>`;
  cont.innerHTML = s + `<div class="tip" hidden></div>`;
  const tip = $(".tip", cont);
  $$("rect[data-k]", cont).forEach(r => {
    const k = +r.dataset.k, d = datos[k], cx = ml + banda * k + banda / 2;
    r.addEventListener("mouseenter", () => {
      tip.innerHTML = `<b>${nombreMes(d.m)}</b><br>Recibiste: ${fmt(d.i)}<br>Gastaste: ${fmt(d.g)}<br>Apartaste: ${signo(d.a)}<br>Libre: ${signo(d.s)}`;
      tip.hidden = false;
      tip.style.left = Math.min(Math.max(cx, 80), W - 80) + "px";
      tip.style.top = Math.max(y(Math.max(d.i, d.g, d.a)) - 8, 80) + "px";
    });
    r.addEventListener("mouseleave", () => (tip.hidden = true));
    r.addEventListener("click", () => { S.mes = d.m; renderView(); });
  });
}

/* ============ importar Excel / CSV ============ */
const PISTAS = {
  fecha: /fecha|date|^dia$/, desc: /descrip|detalle|glosa|concepto|movimiento|comercio|nombre|referencia/,
  monto: /monto|importe|valor|total/, cargo: /cargo|debito|giro|egreso|salida|retiro/, abono: /abono|credito|deposito|ingreso|entrada/,
  tipo: /^tipo/, cat: /categor/, cuenta: /cuenta|medio|forma de pago/
};
function parseCSV(txt) {
  if (txt.charCodeAt(0) === 0xfeff) txt = txt.slice(1);
  const primera = txt.split(/\r?\n/).find(l => l.trim()) || "";
  const sep = [";", ",", "\t", "|"].map(s => [s, primera.split(s).length]).sort((a, b) => b[1] - a[1])[0][0];
  const filas = [];
  let fila = [], campo = "", q = false;
  const cerrar = () => { fila.push(campo); campo = ""; if (fila.some(x => x.trim() !== "")) filas.push(fila.map(x => x.trim())); fila = []; };
  for (let i = 0; i < txt.length; i++) {
    const c = txt[i];
    if (q) { if (c === '"') { if (txt[i + 1] === '"') { campo += '"'; i++; } else q = false; } else campo += c; }
    else if (c === '"') q = true;
    else if (c === sep) { fila.push(campo); campo = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && txt[i + 1] === "\n") i++; cerrar(); }
    else campo += c;
  }
  cerrar();
  return filas;
}
async function leerArchivo(file) {
  if (!file) return;
  const ext = (file.name.split(".").pop() || "").toLowerCase();
  const buf = await file.arrayBuffer();
  const hojas = {};
  try {
    if (ext === "csv" || ext === "txt") {
      let txt = new TextDecoder("utf-8").decode(buf);
      if (txt.includes(String.fromCharCode(0xfffd))) txt = new TextDecoder("windows-1252").decode(buf);
      hojas[file.name] = parseCSV(txt);
    } else {
      if (!window.XLSX) { toast("No se pudo cargar el lector de Excel. Revisa tu conexión y recarga la página."); return; }
      const wb = XLSX.read(buf, { type: "array" });
      wb.SheetNames.forEach(n => (hojas[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: "", blankrows: false })));
    }
  } catch (e) { toast("No se pudo leer el archivo. Guárdalo como .xlsx o .csv e intenta de nuevo."); return; }
  const nombres = Object.keys(hojas);
  if (!nombres.length) { toast("El archivo está vacío."); return; }
  S.imp = { nombre: file.name, hojas, hoja: nombres.find(n => hojas[n].length > 1) || nombres[0], cuentaDef: S.ajustes.cuentas[0] };
  prepararHoja(); renderView();
}
function prepararHoja() {
  const im = S.imp, filas = im.hojas[im.hoja] || [];
  im.enc = 0;
  for (let r = 0; r < Math.min(25, filas.length); r++) {
    const pts = filas[r].filter(c => typeof c === "string" && Object.values(PISTAS).some(re => re.test(norm(c)))).length;
    if (pts >= 2) { im.enc = r; break; }
  }
  autoMapear();
}
function autoMapear() {
  const im = S.imp, head = (im.hojas[im.hoja][im.enc] || []).map(c => norm(c));

    catch (e) { if (e && e.code !== "declined") toast("No se pudo descargar el archivo en esta vista."); return false; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([data], { type: "application/octet-stream" }));

}

      return [m.nombre, m.objetivo, s, m.fecha ? serialExcel(m.fecha) : "", m.archivada ? "Archivada" : s >= m.objetivo ? "Cumplida" : "En curso"];
    })]);
    formatoCols(ws3, [3], [1, 2], [26, 14, 14, 13, 12]);
    XLSX.utils.book_append_sheet(wb, ws3, "Metas");
  }
  await guardarArchivo(`Cuentas_Claras_${hoyISO()}.xlsx`, XLSX.write(wb, { bookType: "xlsx", type: "array" }));
}
async function descargarRespaldo() {
  if (!real().length && !S.ajustes.metas.length) { toast("Aún no hay datos para respaldar."); return; }
  const data = JSON.stringify({ app: "cuentas-claras", version: 2, exportado: new Date().toISOString(), meses: S.meses, ajustes: S.ajustes });
  if (await guardarArchivo(`Respaldo_Cuentas_Claras_${hoyISO()}.json`, data)) { lsSet("cc.ultimoRespaldo", String(Date.now())); renderView(); }
}
async function leerRespaldo(file) {
  if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    if (!d || d.app !== "cuentas-claras" || typeof d.meses !== "object" || !d.meses) throw new Error("formato");
    const movs = Object.values(d.meses).reduce((s, items) => s + Object.values(items || {}).filter(Boolean).length, 0);
    S.restaurar = { d, nombre: file.name, movs, metas: Array.isArray(d.ajustes && d.ajustes.metas) ? d.ajustes.metas.length : 0 };
    setView("ajustes");
  } catch (e) { toast("Ese archivo no es un respaldo de Cuentas Claras."); }
}
async function aplicarRespaldo() {
  const { d, movs } = S.restaurar, meses = {};
  for (const mes in d.meses) {
    if (!/^\d{4}-\d{2}$/.test(mes)) continue;
    const items = {};
    for (const id in d.meses[mes] || {}) {
      const m = d.meses[mes][id];
      if (m && m.id === id && /^\d{4}-\d{2}-\d{2}$/.test(m.fecha) && ["gasto", "ingreso", "ahorro"].includes(m.tipo) && Number.isFinite(+m.monto)) items[id] = { ...m, monto: Math.round(+m.monto) };
    }
    meses[mes] = items;
  }
  const ajustes = normalizarAjustes(d.ajustes);
  try {
    if (S.modo !== "nube") { S.meses = meses; S.ajustes = ajustes; S.ver++; guardarLocal(); }
    else {
      setSync("guardando", "Restaurando…");
      for (const mes of new Set([...Object.keys(S.meses), ...Object.keys(meses)])) await S.db.doc("meses/" + mes).set({ mes, items: meses[mes] || {} });
      await S.db.doc("ajustes/principal").set(JSON.parse(JSON.stringify(ajustes)));
      setSync("nube", "Sincronizado");
    }
    S.restaurar = null; S.logrosPrev = null; S.form = formNuevo(); S.sug = null;
    toast(`Respaldo restaurado: ${plural(movs, "movimiento", "movimientos")}`);
    renderForm(); renderView();
  } catch (e) { toast(msgError(e)); setSync("nube", "Error al restaurar"); }
}

/* ============ metas: guardar y editar ============ */
function metaEditable(id) {
  if (enDemo()) { toast("Es una meta de ejemplo. Crea la tuya con Nueva meta."); return null; }
  return S.ajustes.metas.find(m => m.id === id) || null;
}
function corregirPrincipal() {
  const act = S.ajustes.metas.filter(m => !m.archivada);
  if (!act.some(m => m.id === S.ajustes.metaPrincipal)) S.ajustes.metaPrincipal = act[0] ? act[0].id : "";
}
async function guardarMeta() {
  const mf = S.metaForm, nombre = (mf.nombre || "").trim();
  if (!nombre) { toast("Ponle un nombre a la meta."); $("#mNombre").focus(); return; }
  if (!mf.objetivo) { toast("Indica cuánto quieres juntar."); $("#mObjetivo").focus(); return; }
  if (mf.id) { const m = S.ajustes.metas.find(x => x.id === mf.id); if (m) Object.assign(m, { nombre, objetivo: mf.objetivo, fecha: mf.fecha || "" }); }
  else S.ajustes.metas.push({ id: uid(), nombre, objetivo: mf.objetivo, fecha: mf.fecha || "", creada: hoyISO(), archivada: false });
  corregirPrincipal();
  S.metaForm = null;
  toast(mf.id ? "Meta actualizada" : `Meta “${nombre}” creada`);
  await guardarAjustes();
}

/* ============ eventos ============ */
function nuevoRegistro() {
  if (S.form && S.form.id) S.form = formNuevo(S.form.tipo);
  renderForm(); abrirSheet();
  setTimeout(() => { const el = $("#fMonto"); if (el) el.focus(); }, 60);
}
const soloDigitos = v => parseInt(String(v).replace(/\D/g, "").slice(0, 12), 10) || 0;
document.addEventListener("click", e => {
  const t = e.target;
  if (!(t instanceof Element)) return;
  const vista = t.closest("[data-view]");
  if (vista) { if (esMovil()) cerrarSheet(); setView(vista.dataset.view); return; }
  if (t.closest("#mPrev")) { S.mes = mesSuma(S.mes, -1); renderView(); return; }
  if (t.closest("#mNext")) { S.mes = mesSuma(S.mes, 1); renderView(); return; }
  if (t.closest("#fab")) { nuevoRegistro(); return; }
  if (t.closest("#scrim")) { cerrarSheet(); return; }
  const tipoBtn = t.closest(".seg button[data-t]");
  if (tipoBtn) {
    const f = S.form; f.tipo = tipoBtn.dataset.t;
    if (f.tipo !== "ahorro" && !cats(f.tipo).some(c => c.nombre === f.cat)) { f.cat = sugerir(f.desc, f.tipo); f.catManual = false; }
    renderForm(); return;
  }
  const sentido = t.closest("[data-sentido]");
  if (sentido) { S.form.sentido = sentido.dataset.sentido; renderForm(); return; }
  const fmeta = t.closest("[data-fmeta]");
  if (fmeta) { S.form.meta = fmeta.dataset.fmeta; renderForm(); return; }
  const chipCat = t.closest("#fCats .chip");
  if (chipCat) { const f = S.form; f.cat = f.cat === chipCat.dataset.cat ? "" : chipCat.dataset.cat; f.catManual = !!f.cat; pintarChips(); return; }
  const chipFecha = t.closest("[data-fecha]");
  if (chipFecha) { S.form.fecha = chipFecha.dataset.fecha; renderForm(); return; }
  const mov = t.closest(".mov");
  if (mov) { const m = buscarMov(mov.dataset.id, mov.dataset.mes); if (m) abrirEdicion(m); return; }
  const mAp = t.closest("[data-meta-apartar]");
  if (mAp) { abrirAhorro(mAp.dataset.metaApartar, "apartar"); return; }
  const mSa = t.closest("[data-meta-sacar]");
  if (mSa) { abrirAhorro(mSa.dataset.metaSacar, "sacar"); return; }
  const mPr = t.closest("[data-meta-principal]");
  if (mPr) { if (metaEditable(mPr.dataset.metaPrincipal)) { S.ajustes.metaPrincipal = mPr.dataset.metaPrincipal; toast("Meta principal actualizada"); guardarAjustes(); } return; }
  const mEd = t.closest("[data-meta-editar]");
  if (mEd) { const m = metaEditable(mEd.dataset.metaEditar); if (m) { S.metaForm = { id: m.id, nombre: m.nombre, objetivo: m.objetivo, fecha: m.fecha, confirmar: false }; renderView(); window.scrollTo({ top: 0 }); } return; }
  const mRe = t.closest("[data-meta-reactivar]");
  if (mRe) { const m = metaEditable(mRe.dataset.metaReactivar); if (m) { m.archivada = false; corregirPrincipal(); toast(`“${m.nombre}” está activa otra vez`); guardarAjustes(); } return; }
  const delCat = t.closest("[data-delcat]");
  if (delCat) {
    const tipo = delCat.dataset.tipo;
    if (cats(tipo).length <= 1) { toast("Debe quedar al menos una categoría de " + tipo + "."); return; }
    S.ajustes.categorias = S.ajustes.categorias.filter(c => !(c.nombre === delCat.dataset.delcat && c.tipo === tipo));
    toast(`Categoría “${delCat.dataset.delcat}” quitada. Los movimientos que la usan no cambian.`);
    guardarAjustes(); return;
  }
  const delCuenta = t.closest("[data-delcuenta]");
  if (delCuenta) {
    if (S.ajustes.cuentas.length <= 1) { toast("Debe quedar al menos una cuenta."); return; }
    S.ajustes.cuentas = S.ajustes.cuentas.filter(c => c !== delCuenta.dataset.delcuenta);
    guardarAjustes(); return;
  }
  const acc = t.closest("[data-a]");
  if (!acc) return;
  const im = S.imp;
  switch (acc.dataset.a) {
    case "nuevo": nuevoRegistro(); break;
    case "apartar": { const mp = metaPrincipal(); abrirAhorro(mp && mp.id); break; }
    case "irMetaNueva":
      S.metaForm = { nombre: "", objetivo: 0, fecha: "" };
      if (esMovil()) cerrarSheet();
      setView("metas");
      setTimeout(() => { const el = $("#mNombre"); if (el) el.focus(); }, 60);
      break;
    case "metaNueva": S.metaForm = { nombre: "", objetivo: 0, fecha: "" }; renderView(); $("#mNombre").focus(); break;
    case "metaCancelar": S.metaForm = null; renderView(); break;
    case "metaArchivar": {
      const m = S.ajustes.metas.find(x => x.id === S.metaForm.id);
      if (m) { m.archivada = true; corregirPrincipal(); S.metaForm = null; toast(`“${m.nombre}” archivada`); guardarAjustes(); }
      break;
    }
    case "metaEliminar": {
      const mf = S.metaForm;
      if (!mf.confirmar) {
        mf.confirmar = true; renderView();
        setTimeout(() => { if (S.metaForm === mf && mf.confirmar) { mf.confirmar = false; renderView(); } }, 3500);
        break;
      }
      S.ajustes.metas = S.ajustes.metas.filter(x => x.id !== mf.id);
      corregirPrincipal(); S.metaForm = null; toast("Meta eliminada"); guardarAjustes();
      break;
    }
    case "sugOk": aceptarSugerencia(); break;
    case "sugOtro": { const s = S.sug; if (s) abrirAhorro(s.meta, "apartar", s.monto, s.fecha); break; }
    case "sugNo": S.sug = null; renderForm(); if (esMovil()) cerrarSheet(); break;
    case "cerrar": cerrarSheet(); break;
    case "cancelar": S.form = formNuevo(S.form.tipo); renderForm(); if (esMovil()) cerrarSheet(); break;
    case "eliminar": eliminarDesdeForm(false); break;
    case "eliminarGrupo": eliminarDesdeForm(true); break;
    case "ocultarDemo": S.demoOculto = true; lsSet("cc.demoOculto", "1"); renderView(); break;
    case "plantilla": descargarPlantilla(); break;
    case "exportar": exportarExcel(); break;
    case "respaldo": descargarRespaldo(); break;
    case "restaurar": { const inp = $("#restFile"); inp.value = ""; inp.click(); break; }
    case "restaurarSi": aplicarRespaldo(); break;
    case "restaurarNo": S.restaurar = null; renderView(); break;
    case "instalar":
      if (S.instalar) { S.instalar.prompt(); S.instalar.userChoice.finally(() => { S.instalar = null; renderView(); }); }
      break;
    case "impTodas": case "impNinguna":
      construirPreview().filas.forEach(r => (im.over[r.i] = { ...im.over[r.i], sel: acc.dataset.a === "impTodas" }));
      renderView(); break;
    case "impCancelar": S.imp = null; renderView(); break;
    case "impOk": importar(); break;
  }
});
document.addEventListener("submit", e => {
  const f = e.target;
  e.preventDefault();
  if (f.id === "frm") { enviarForm(); return; }
  if (f.id === "frmMeta") { guardarMeta(); return; }
  const nombre = ((f.elements.n && f.elements.n.value) || "").trim();
  if (!nombre) return;
  if (f.dataset.addcat) {
    const tipo = f.dataset.addcat;
    if (cats(tipo).some(c => norm(c.nombre) === norm(nombre))) { toast("Esa categoría ya existe."); return; }
    S.ajustes.categorias.push({ nombre, tipo, presupuesto: 0 });
  } else if (f.dataset.addcuenta) {
    if (S.ajustes.cuentas.some(c => norm(c) === norm(nombre))) { toast("Esa cuenta ya existe."); return; }
    S.ajustes.cuentas.push(nombre);
  }
  guardarAjustes();
});
document.addEventListener("input", e => {
  const t = e.target, f = S.form;
  if (t.id === "fMonto") {
    f.monto = soloDigitos(t.value);
    t.value = f.monto ? fmtN(f.monto) : "";
    const h = $("#fCuotasHint"); if (h) h.textContent = hintCuotas(f);
  } else if (t.id === "fDesc") {
    f.desc = t.value;
    if (!f.catManual && f.tipo !== "ahorro") { f.cat = sugerir(f.desc, f.tipo); pintarChips(); }
  } else if (t.id === "fCuotas") {
    f.cuotas = t.value; $("#fCuotasHint").textContent = hintCuotas(f);
  } else if (t.id === "fq") {
    S.filtro.q = t.value; renderView();
  } else if (t.id === "mNombre") {
    S.metaForm.nombre = t.value;
  } else if (t.id === "mObjetivo") {
    S.metaForm.objetivo = soloDigitos(t.value);
    t.value = S.metaForm.objetivo ? fmtN(S.metaForm.objetivo) : "";
  }
});
document.addEventListener("change", e => {
  const t = e.target, f = S.form, im = S.imp;
  if (t.id === "fFecha") {
    f.fecha = t.value;
    $$("[data-fecha]").forEach(b => b.setAttribute("aria-pressed", b.dataset.fecha === f.fecha));
    const h = $("#fCuotasHint"); if (h) h.textContent = hintCuotas(f);
  } else if (t.id === "fCuenta") { f.cuenta = t.value; renderForm(); }
  else if (t.id === "mFecha") { S.metaForm.fecha = t.value; }
  else if (t.id === "pctAhorro") { S.ajustes.ahorroPct = +t.value; toast(+t.value ? `Te propondré apartar el ${t.value}% de cada ingreso` : "Ya no te propondré apartar al registrar ingresos"); guardarAjustes(); }
  else if (t.id === "restFile") { leerRespaldo(t.files[0]); }
  else if (t.id === "ftipo") { S.filtro.tipo = t.value; renderView(); }
  else if (t.id === "fcat") { S.filtro.cat = t.value; renderView(); }
  else if (t.id === "impFile") { leerArchivo(t.files[0]); }
  else if (t.id === "impHoja") { im.hoja = t.value; prepararHoja(); renderView(); }
  else if (t.id === "impEnc") { im.enc = +t.value; autoMapear(); renderView(); }
  else if (t.dataset.map) { im.map[t.dataset.map] = t.value === "" ? "" : +t.value; im.over = {}; im.positivos = null; renderView(); }
  else if (t.id === "impPos") { im.positivos = t.value; renderView(); }
  else if (t.id === "impCuenta") { im.cuentaDef = t.value; renderView(); }
  else if (t.dataset.sel) { im.over[t.dataset.sel] = { ...im.over[t.dataset.sel], sel: t.checked }; renderView(); }
  else if (t.dataset.impcat) { im.over[t.dataset.impcat] = { ...im.over[t.dataset.impcat], cat: t.value }; }
  else if (t.dataset.pres) {
    const c = S.ajustes.categorias.find(c => c.nombre === t.dataset.pres && c.tipo === "gasto");
    if (c) { c.presupuesto = soloDigitos(t.value); guardarAjustes(); }
  }
});
document.addEventListener("dragover", e => { const d = e.target.closest && e.target.closest("#drop"); if (d) { e.preventDefault(); d.classList.add("hover"); } });
document.addEventListener("dragleave", e => { const d = e.target.closest && e.target.closest("#drop"); if (d) d.classList.remove("hover"); });
document.addEventListener("drop", e => { const d = e.target.closest && e.target.closest("#drop"); if (d) { e.preventDefault(); leerArchivo(e.dataTransfer.files[0]); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#aside").classList.contains("open")) cerrarSheet(); });
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); S.instalar = e; if (S.view === "ajustes") renderView(); });
let resizeT;
window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (S.view === "resumen") montarGrafico(); }, 150); });

S.form = formNuevo();
init();
</script>
